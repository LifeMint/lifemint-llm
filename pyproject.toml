[project]
name = "lifemint-llm"
version = "0.1.0"
description = "Vendor LLM client side-package for LifeMint instances and cloud spaces. Standard library only. lifemint-core never imports this."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lifemint_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
